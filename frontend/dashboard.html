<!DOCTYPE html>

<html>

<head>

<title>
AI Academic Assistant
</title>

<link rel="stylesheet" href="/frontend/style.css">

</head>


<body>


<div class="app">


<!-- SIDEBAR -->

<div class="sidebar">


<h2>
🤖 AI Assistant
</h2>


<button onclick="newChat()">
+ New Chat
</button>


<button onclick="document.getElementById('pdf').click()">
📄 Upload PDF
</button>


<input 
type="file"
id="pdf"
hidden
onchange="uploadPDF()">



<h3>
History
</h3>


<div id="history">

</div>


</div>





<!-- CHAT AREA -->


<div class="chat">


<div class="chat-header">

AI Academic Assistant

</div>



<div id="messages"
class="messages">


<div class="bot">

Hello 👋 Upload your PDF and ask questions.

</div>


</div>



<div class="input-area">


<input
id="question"
placeholder="Ask anything...">



<button onclick="askAI()">

Send

</button>


</div>


</div>


</div>


<script src="/frontend/app.js"></script>


</body>

</html>
